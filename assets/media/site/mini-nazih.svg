<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 290" width="160" height="290">
  <!-- Mini Nazih: flat illustration, full body, gliding with his camera. Drawn from the About portrait. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DBA682"/><stop offset="1" stop-color="#C48D69"/></linearGradient>
    <linearGradient id="vest" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2D2E34"/><stop offset="1" stop-color="#16171B"/></linearGradient>
    <linearGradient id="trousers" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#30333B"/><stop offset="1" stop-color="#1C1E23"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E6EC"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E3B4"/><stop offset=".55" stop-color="#E2B865"/><stop offset="1" stop-color="#B9873A"/></linearGradient>
    <radialGradient id="glassTint" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#C9D8FF" stop-opacity=".28"/><stop offset="1" stop-color="#8C7BE8" stop-opacity=".2"/></radialGradient>
  </defs>

  <!-- legs, swept slightly back as if gliding -->
  <g id="legs">
    <path d="M64 170 L60 218 Q59 236 54 248 L50 258 L64 262 L68 250 Q73 236 74 220 L80 172 Z" fill="url(#trousers)"/>
    <path d="M80 172 L84 214 Q86 230 94 240 L102 250 L113 242 L104 232 Q98 224 97 210 L96 170 Z" fill="url(#trousers)"/>
    <path d="M73 186 L72 214" stroke="#15171B" stroke-width="1.2" opacity=".6"/>
    <path d="M47 256 Q42 263 48 268 L66 269 Q71 267 67 262 L63 258 Z" fill="#0E0F12"/>
    <path d="M48 263 Q55 266 65 266" stroke="#3E414A" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <path d="M101 246 Q108 240 116 241 Q122 245 118 250 L106 257 Q100 254 101 246 Z" fill="#0E0F12"/>
    <path d="M106 251 Q112 248 117 246" stroke="#3E414A" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- torso: shirt, black vest, dark tie -->
  <g id="body">
    <path d="M58 108 Q58 98 70 95 L80 93 L90 95 Q102 98 102 108 L100 150 Q99 162 97 174 L63 174 Q61 162 60 150 Z" fill="url(#shirt)"/>
    <path d="M60 107 Q61 99 70 96.5 L77 95 L80 118 L83 95 L90 96.5 Q99 99 100 107 L98.5 150 Q97.5 163 96 174 L64 174 Q62.5 163 61.5 150 Z" fill="url(#vest)"/>
    <path d="M71 96 L80 124 L89 96 Z" fill="url(#shirt)"/>
    <path d="M77.6 97 L82.4 97 L81.6 102 L78.4 102 Z" fill="#3A3F48"/>
    <path d="M78.4 102 L81.6 102 L84 121 L80 126 L76 121 Z" fill="#24272D"/>
    <path d="M78.6 108 L82.6 111 M78 115 L83.4 118.5" stroke="#4C515A" stroke-width=".9" stroke-linecap="round"/>
    <path d="M71 95.5 L76.5 103 L80 96.5 Z M89 95.5 L83.5 103 L80 96.5 Z" fill="#FFFFFF" stroke="#D2D5DC" stroke-width=".7"/>
    <circle cx="80" cy="160" r="1.4" fill="#4C515A"/><circle cx="80" cy="168" r="1.4" fill="#4C515A"/>
    <path d="M63.5 173 L96.5 173" stroke="#0E0F12" stroke-width="2.6"/>
  </g>

  <!-- arms: white sleeves bending from the shoulders down to the camera -->
  <g id="arms" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M63 104 Q52 112 51 128 Q51 140 60 146" stroke="#D2D5DC" stroke-width="13.5"/>
    <path d="M63 104 Q52 112 51 128 Q51 140 60 146" stroke="url(#shirt)" stroke-width="12"/>
    <path d="M97 104 Q108 112 109 128 Q109 140 100 146" stroke="#D2D5DC" stroke-width="13.5"/>
    <path d="M97 104 Q108 112 109 128 Q109 140 100 146" stroke="url(#shirt)" stroke-width="12"/>
    <path d="M52 124 Q55 128 54 134 M108 124 Q105 128 106 134" stroke="#D9DCE2" stroke-width="1"/>
  </g>

  <!-- camera with the site's gold lens ring -->
  <g id="camera">
    <rect x="58" y="132" width="44" height="28" rx="5" fill="#141518"/>
    <rect x="63" y="127.5" width="13" height="6.5" rx="2" fill="#141518"/>
    <rect x="88" y="129.5" width="8.5" height="3.6" rx="1.5" fill="url(#gold)"/>
    <circle cx="80" cy="147" r="11.5" fill="url(#gold)"/>
    <circle cx="80" cy="147" r="8.7" fill="#0B0C0E"/>
    <circle cx="80" cy="147" r="5.6" fill="#1F2A44"/>
    <circle cx="77.6" cy="144.6" r="2" fill="#9FB7FF" opacity=".8"/>
    <circle cx="96.5" cy="138" r="1.5" fill="#E2584F"/>
  </g>

  <!-- hands, black watch on the left wrist, ring on the right hand -->
  <g id="hands">
    <path d="M55 141 Q53 151 59 157 L65 155 Q63 148 62 141 Z" fill="url(#skin)"/>
    <path d="M105 141 Q107 151 101 157 L95 155 Q97 148 98 141 Z" fill="url(#skin)"/>
    <rect x="52" y="137" width="11" height="5.5" rx="2" fill="#111214"/>
    <circle cx="57.5" cy="139.8" r="2.3" fill="#2C2F36" stroke="#5A5E66" stroke-width=".6"/>
    <path d="M97.5 150 L101.5 149" stroke="#C9CDD4" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- head -->
  <g id="head">
    <path d="M74 82 L86 82 L87 95 Q80 99 73 95 Z" fill="#C48D69"/>
    <ellipse cx="63" cy="58" rx="4.2" ry="6.5" fill="#CB9672"/>
    <ellipse cx="97" cy="58" rx="4.2" ry="6.5" fill="#CB9672"/>
    <path d="M64.5 46 Q64.5 28 80 27 Q95.5 28 95.5 46 L95.5 64 Q94.5 80 80 86 Q65.5 80 64.5 64 Z" fill="url(#skin)"/>
    <!-- trimmed beard and moustache -->
    <path d="M65 58 Q65.5 76 74 83 Q80 87 86 83 Q94.5 76 95 58 Q93 70 88 73 Q80 76 72 73 Q67 70 65 58 Z" fill="#2B231E"/>
    <path d="M72.5 70 Q80 66.5 87.5 70 Q84 72 80 71 Q76 72 72.5 70 Z" fill="#2B231E"/>
    <path d="M75.5 75 Q80 77.5 84.5 75" stroke="#A86450" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- short curly hair: full on top, faded on the sides -->
    <path d="M64 50 Q63 40 66.5 35 L67 47 Z M96 50 Q97 40 93.5 35 L93 47 Z" fill="#4A3F38" opacity=".7"/>
    <path d="M64.5 43 Q63 26 80 22 Q97 26 95.5 43 Q90 35 80 35.5 Q70 35 64.5 43 Z" fill="#1D1916"/>
    <g fill="#1D1916">
      <circle cx="68.5" cy="31" r="4.4"/><circle cx="74.5" cy="26.5" r="4.6"/><circle cx="81" cy="24.5" r="4.8"/><circle cx="87.5" cy="26.5" r="4.6"/><circle cx="92.5" cy="31" r="4.2"/>
      <circle cx="71.5" cy="35" r="3.6"/><circle cx="78" cy="31.5" r="3.8"/><circle cx="85" cy="31.5" r="3.8"/><circle cx="90.5" cy="35" r="3.4"/>
    </g>
    <g fill="none" stroke="#3E352F" stroke-width="1" stroke-linecap="round">
      <path d="M71 28 q1.8 -2.6 3.6 0"/><path d="M78.5 25 q1.8 -2.6 3.6 0"/><path d="M85.5 27.5 q1.8 -2.6 3.6 0"/>
      <path d="M74 33 q1.8 -2.6 3.6 0"/><path d="M82 33 q1.8 -2.6 3.6 0"/><path d="M68 34 q1.6 -2.2 3.2 0"/><path d="M89 33.5 q1.6 -2.2 3.2 0"/>
    </g>
    <!-- brows, eyes, nose -->
    <path d="M68.8 49.5 Q72.6 47.2 76.4 49 M83.6 49 Q87.4 47.2 91.2 49.5" stroke="#1D1916" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="73" cy="55" rx="1.9" ry="2.2" fill="#1A1412"/><ellipse cx="87" cy="55" rx="1.9" ry="2.2" fill="#1A1412"/>
    <circle cx="73.6" cy="54.3" r=".6" fill="#FFFFFF"/><circle cx="87.6" cy="54.3" r=".6" fill="#FFFFFF"/>
    <path d="M80 56 Q79 62.5 77.6 63.5 Q80 65 82.4 63.5" stroke="#A8775A" stroke-width="1.15" fill="none" stroke-linecap="round"/>
    <!-- thin metal glasses -->
    <g stroke="#CFC8BA" stroke-width="1.2" fill="url(#glassTint)">
      <rect x="66.3" y="50.2" width="12.6" height="9.6" rx="3"/>
      <rect x="81.1" y="50.2" width="12.6" height="9.6" rx="3"/>
    </g>
    <path d="M78.9 53.4 Q80 52.4 81.1 53.4 M66.3 53 L63.8 52 M93.7 53 L96.2 52" stroke="#CFC8BA" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
